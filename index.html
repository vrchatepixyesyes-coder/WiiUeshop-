<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  iframe#site {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
  }
  #yt {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    bottom: 0;
    right: 0;
  }
  /* Overlay to capture first click and unlock audio autoplay */
  #unlock {
    position: fixed;
    inset: 0;
    z-index: 9999;
    cursor: pointer;
    background: transparent;
  }
</style>
</head>
<body>

<!-- The website -->
<iframe id="site" src="https://www.canva.com/design/DAHJNu0PTLw/FpsfPv-fPwf17TwEg1493w/view" allow="autoplay; fullscreen"></iframe>

<!-- Invisible YouTube player div -->
<div id="yt"></div>

<!-- Invisible click-unlock overlay (removed after first interaction) -->
<div id="unlock"></div>

<script>
  var player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt', {
      videoId: 'dlATDrdpK0o',
      playerVars: {
        autoplay: 1,
        loop: 1,
        playlist: 'dlATDrdpK0o',
        controls: 0,
        mute: 0
      },
      events: {
        onReady: function(e) {
          e.target.setVolume(70);
          e.target.playVideo();
        },
        onStateChange: function(e) {
          if (e.data === YT.PlayerState.ENDED) {
            player.playVideo();
          }
        }
      }
    });
  }

  // Some browsers need a user gesture to play audio.
  // The invisible overlay captures the first click anywhere on the page.
  var unlock = document.getElementById('unlock');
  unlock.addEventListener('click', function() {
    if (player && player.playVideo) player.playVideo();
    unlock.remove();
  }, { once: true });

  // Load the YouTube IFrame API
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
</script>
</body>
</html>
