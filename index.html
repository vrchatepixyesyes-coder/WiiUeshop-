<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  /* Overlay to capture first click and unlock audio autoplay */
  #unlock {
    position: fixed;
    inset: 0;
    z-index: 9999;
    cursor: pointer;
    background: transparent;
  }
</style>
</head>
<body>

<!-- The website -->

<!-- Invisible YouTube player div -->
<div id="yt"></div>

<!-- Invisible click-unlock overlay (removed after first interaction) -->
<div id="unlock"></div>

<script>
  var player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt', {
      videoId: 'dlATDrdpK0o',
      playerVars: {
        autoplay: 1,
        loop: 1,
        playlist: 'dlATDrdpK0o',
        controls: 0,
        mute: 0
      },
      events: {
        onReady: function(e) {
          e.target.setVolume(70);
          e.target.playVideo();
        },
        onStateChange: function(e) {
          if (e.data === YT.PlayerState.ENDED) {
            player.playVideo();
          }
        }
      }
    });
  }

  // Some browsers need a user gesture to play audio.
  // The invisible overlay captures the first click anywhere on the page.
  var unlock = document.getElementById('unlock');
  unlock.addEventListener('click', function() {
    if (player && player.playVideo) player.playVideo();
    unlock.remove();
  }, { once: true });

  // Load the YouTube IFrame API
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
</script>
</body>
</html>
