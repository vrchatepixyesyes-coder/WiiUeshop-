<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eShop</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: white;
        }

        .canva-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .canva-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" autoplay loop>
        <source src="https://raw.githubusercontent.com/vrchatepixyesyes-coder/WiiUeshop-/7b4196628d0dc1425c561a186b5d7e49ddf94c9f/23.%20May%202019%20(3DS%20%26%20Wii%20U).mp3" type="audio/mpeg">
    </audio>

    <script>
        // Backup autoplay trigger
        const music = document.getElementById("bgMusic");

        window.addEventListener("load", () => {
            music.play().catch(() => {
                document.addEventListener("click", () => {
                    music.play();
                }, { once: true });
            });
        });
    </script>

    <!-- Canva Embed -->
    <div class="canva-container">
        <iframe
            loading="lazy"
            src="https://www.canva.com/design/DAHJNu0PTLw/FpsfPv-fPwf17TwEg1493w/view?embed"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
